[gcode_macro LINE_PURGE]
description: Adaptive purge line near object
gcode:
    SAVE_GCODE_STATE NAME=LINE_PURGE_STATE
 
    M117 Adaptive Purge...
    
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
 
    {% if all_points|length > 0 %}
        {% set x_origin = all_points | map(attribute=0) | min %}
        {% set y_origin = all_points | map(attribute=1) | min %}
    {% else %}
        {% set x_origin = 15 %}
        {% set y_origin = 15 %}
    {% endif %}
 
    # Keep purge away from edges
    {% set x_origin = [x_origin, 5] | max %}
    {% set y_purge = [y_origin - 30, 5] | max %}
 
    G92 E0
    G90
    M83
 
    # Move to purge location
    G1 X{x_origin} Y{y_purge} Z0.15 F6000
 
    # Prime nozzle
    G1 E5 F300
 
    # Main purge line - clamped so a large/edge-positioned object can't push this past X max
    {% set x_end = [x_origin + 110, printer.toolhead.axis_maximum.x - 5]|min %}
    G1 X{x_end} E25 F1500
 
    # Wipe nozzle forward - anchored to the clamped endpoint, not recomputed from x_origin,
    # so it can't independently exceed X max either
    {% set x_wipe = [x_end + 10, printer.toolhead.axis_maximum.x - 5]|min %}
    G1 X{x_wipe} F4000
 
    # Small retract to prevent string
    G1 E-0.5 F1800
 
    G4 P250
 
    G92 E0
    M82
 
    # Lift before moving to print
    G1 Z2 F3000
 
   RESTORE_GCODE_STATE NAME=LINE_PURGE_STATE

[gcode_macro LINE_PURGE2]
description: Adaptive purge line near object
gcode:
    SAVE_GCODE_STATE NAME=LINE_PURGE_STATE

    M117 Adaptive Purge...
    
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}

    {% if all_points|length > 0 %}
        {% set x_origin = all_points | map(attribute=0) | min %}
        {% set y_origin = all_points | map(attribute=1) | min %}
    {% else %}
        {% set x_origin = 15 %}
        {% set y_origin = 15 %}
    {% endif %}

    # Keep purge away from edges
    {% set x_origin = [x_origin, 5] | max %}
    {% set y_purge = [y_origin - 30, 5] | max %}

    G92 E0
    G90
    M83

    # Move to purge location
    G1 X{x_origin} Y{y_purge} Z0.15 F6000

    # Prime nozzle
    G1 E5 F300

    # Main purge line
    G1 X{x_origin + 110} E25 F1500

    # Wipe nozzle forward
    G1 X{x_origin + 120} F4000

    # Small retract to prevent string
    G1 E-0.5 F1800

    G4 P250

    G92 E0
    M82

    # Lift before moving to print
    G1 Z2 F3000

   RESTORE_GCODE_STATE NAME=LINE_PURGE_STATE




#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SET_FAN_SPEED FAN=Nevermore SPEED=0
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    M84 


#   Use PRINT_END for the slicer ending script - USE FOR CHAMBER FUME CLEANING
[gcode_macro PRINT_END_CHAMBER]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    FILTER_AFTER_PRINT
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    M84 







#############################################################
# HEATSOAK
#########################################################


[gcode_macro __HEATSOAK_PARAMS]
description: Storage for chamber heatsoak parameters
variable_target_chamber: 0.0
variable_checks_remaining: 0
gcode:
  ; This macro is only used to hold variables

[delayed_gcode HEATSOAK_CHECK]
initial_duration: 0.           # will be started/updated from PRINT_START
gcode:
  {% set target = printer['gcode_macro __HEATSOAK_PARAMS'].target_chamber|float %}
  {% set checks_remaining = printer['gcode_macro __HEATSOAK_PARAMS'].checks_remaining|int %}
  {% set cur = printer['temperature_sensor chamber'].temperature %}
  {% if cur is none %}
    RESPOND TYPE=error MSG="HEATSOAK: chamber sensor not found!"
    UPDATE_DELAYED_GCODE ID=HEATSOAK_CHECK DURATION=0
  {% else %}
    {% if cur >= target %}
      M117 Chamber reached {target}C — soaking 5 min...
      G4 P300000            ; 5 minute soak
      UPDATE_DELAYED_GCODE ID=HEATSOAK_CHECK DURATION=0
      M106 S0
      SET_FAN_SPEED FAN=Nevermore SPEED=0
      RESUME
    {% elif checks_remaining <= 0 %}
      M117 Chamber timeout — proceeding with 5 min soak...
      G4 P300000            ; 5 minute soak after timeout
      UPDATE_DELAYED_GCODE ID=HEATSOAK_CHECK DURATION=0
      M106 S0
      SET_FAN_SPEED FAN=Nevermore SPEED=0
      RESUME
    {% else %}
      ; Not reached yet — check again in 5 seconds
      SET_GCODE_VARIABLE MACRO=__HEATSOAK_PARAMS VARIABLE=checks_remaining VALUE={checks_remaining - 1}
      UPDATE_DELAYED_GCODE ID=HEATSOAK_CHECK DURATION=5
    {% endif %}
  {% endif %}

   



#####################################################################
#  PID Macros
#####################################################################


[gcode_macro PID_BED_65]
description: Start Bed PID 
  
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  M106
  G1 Z50 F1500
  RESPOND MSG="Bed PID in progress..."
  PID_CALIBRATE HEATER=heater_bed TARGET={params.TEMP|default(65)}
  G28
  SAVE_CONFIG
  {% endif %}


[gcode_macro MPC_HOTEND_220]
description: Start Hotend PID
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  RESPOND TYPE=error MSG="This macro cannot be used while printing!"
  {% else %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  G1 Z50 F1500
  RESPOND MSG="Hotend PID in progress..."
  MPC_CALIBRATE HEATER=extruder TARGET=220 FAN_BREAKPOINTS=11
  SAVE_CONFIG
  {% endif %}

[gcode_macro CALIBRATE_MPC_HOTEND]
description: Run Kalico MPC_CALIBRATE on the extruder. Usage: CALIBRATE_MPC_HOTEND [TARGET=220] [FAN_BREAKPOINTS=3]
gcode:
  {% set target = params.TARGET|default(220)|float %}
  {% set breakpoints = params.FAN_BREAKPOINTS|default(3)|int %}
  RESPOND MSG="Starting MPC calibration at {target}C - this takes a few minutes"
  MPC_CALIBRATE HEATER=extruder TARGET={target} FAN_BREAKPOINTS={breakpoints}
  RESPOND MSG="MPC calibration done - run SAVE_CONFIG to keep it"



[gcode_macro TUNE_BED_PID]
description: Run PID_CALIBRATE on heater_bed. Usage: TUNE_BED_PID [TARGET=90]
gcode:
  {% set target = params.TARGET|default(90)|float %}
  RESPOND MSG="Starting bed PID tune at {target}C"
  PID_CALIBRATE HEATER=heater_bed TARGET={target}
  RESPOND MSG="Bed PID tune done - run SAVE_CONFIG to keep it"




