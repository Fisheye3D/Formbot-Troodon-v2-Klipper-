
###################################################################
# Home if NEEDED
###################################################################


[gcode_macro _CG28]
# Perform a homing action only if one of the axes isn't homed.
description: Conditional home (i.e., home only if not homed already)
gcode:

    {% set verbose = params.VERBOSE|default(False) %}

    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        {% if verbose %}
            { action_respond_info("Homing!") }
        {% endif %}
        G28
    {% endif %}



[gcode_macro _CQUAD_GANTRY_LEVEL]
description: Conditional Quad Gantry Level (only runs if needed)
gcode:
    {% set verbose = params.VERBOSE|default(False) %}
    
    ; Require Z to be homed before QGL
    {% if "z" not in printer.toolhead.homed_axes %}
        {% if verbose %}
            { action_respond_info("Z not homed, homing now before QGL") }
        {% endif %}
        G28
    {% endif %}
    
    ; Check if QGL has already been run
    {% if not printer.quad_gantry_level.applied %}
        {% if verbose %}
            { action_respond_info("Running Quad Gantry Level") }
        {% endif %}
        QUAD_GANTRY_LEVEL
    {% else %}
        {% if verbose %}
            { action_respond_info("Skipping QGL (already applied)") }
        {% endif %}
    {% endif %}
#####################################################################
# Print Start/End and line purge
#####################################################################


[gcode_macro PRINT_START]
description: Beacon Contact + Orca chamber temp + adaptive mesh + 15min wait + 5min soak + fixed expansion offset
gcode:
  {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
  {% set nozzle = params.NOZZLE|default(0.4)|float %}
  {% set target_bed = params.BED|default(60)|float %}
  {% set target_extruder = params.EXTRUDER|default(200)|float %}
  {% set target_chamber = params.CHAMBER|default(0)|float %}

  # Clear adaptive flag
  SET_GCODE_VARIABLE MACRO=SET_MATERIAL VARIABLE=adaptive_mesh VALUE=False

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0

  M117 Homing all axes...
  G28 

  M117 Quad gantry leveling...
  _CQUAD_GANTRY_LEVEL

  M117 Re-homing Z after QGL (calibrate)...
  G28 Z METHOD=CONTACT CALIBRATE=1

  
  G0 Z5

  M117 Heating bed to {target_bed}C...
  M190 S{target_bed}

  {% if target_bed > 90 and target_chamber > 0 %}
    M117 Starting chamber wait (target {target_chamber}C, max 15 min)...
    M106 S155
    SET_FAN_SPEED FAN=Nevermore SPEED=1
    SET_GCODE_VARIABLE MACRO=__HEATSOAK_PARAMS VARIABLE=target_chamber VALUE={target_chamber}
    SET_GCODE_VARIABLE MACRO=__HEATSOAK_PARAMS VARIABLE=checks_remaining VALUE=180
    UPDATE_DELAYED_GCODE ID=HEATSOAK_CHECK DURATION=5
    PAUSE
  {% else %}
    M117 Short soak 2 min...
    G4 p1000 #G4 P120000
  {% endif %}

  M117 Preheating nozzle to 150C for beacon probing...
  G0 X270 Y353 Z10
  M109 S150
  G4 P10000

  M117 Wiping nozzle...
  NOZZLE_CLEAN_NO_HOME

  M117 Re-homing Z
  G28 Z METHOD=CONTACT CALIBRATE=1

  M117 Adaptive mesh (2 runs)...
  BED_MESH_CALIBRATE PROFILE=adaptive_{MATERIAL} ADAPTIVE=1 RUNS=2
  BED_MESH_PROFILE SAVE=adaptive_{MATERIAL}
  SET_GCODE_VARIABLE MACRO=SET_MATERIAL VARIABLE=adaptive_mesh VALUE=True


  M117 Final contact Z-home (no calibration)...
  G28 Z METHOD=CONTACT CALIBRATE=0

  M117 Moving to brush for final heating
  G0 X270 Y353 Z10 F2000
  G1 Z-0.6 F200

  M117 Heating nozzle to {target_extruder}C...
  M109 S{target_extruder}
  G4 P3000

  M117 Wiping nozzle again...
  NOZZLE_CLEAN_HEATED

  M83
  G1 E-0.6 F1800
  M82

  M117 Applying thermal expansion offset...
  SET_GCODE_OFFSET Z=0.02
  SET_GCODE_OFFSET Z_ADJUST={params.OFFSET|default(0)}

  M117 Applying material-specific settings...
  SET_MATERIAL MATERIAL={MATERIAL} NOZZLE={nozzle} OFFSET={params.OFFSET|default(0)}

  M117 Setting retraction distance...
  SET_RETRACT_DISTANCE MATERIAL_TYPE={MATERIAL}

  LINE_PURGE

  M117 Printing...


