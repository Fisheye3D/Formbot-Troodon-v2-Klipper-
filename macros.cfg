[gcode_macro NOZZLE_CLEAN_HEAT_UP]
description: Heat nozzle and wipe on brush
gcode:

  # Home logic
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 X Y
    G28 Z METHOD=PROXIMITY
  {% else %}
    G28 X Y
  {% endif %}

  # Run QGL only if needed
  {% if not printer.quad_gantry_level.applied %}
    QUAD_GANTRY_LEVEL
    G28 Z METHOD=PROXIMITY
  {% endif %}

  G90

  # Move to brush
  G1 X270 Y353 F6000

  # Heat nozzle
  M109 S190
  G4 p30000

  # Lower onto brush
  G1 Z-0.6 F200

  # Fast wipes
  G1 X315 Y353 F10000
  G1 X270 Y353 F10000
  G1 X315 Y353 F10000
  G1 X270 Y353 F10000
  G1 X315 Y353 F10000
  G1 X270 Y353 F10000

