#####################################################################
# FILTER_AFTER_PRINT
#
# You already have a [delayed_gcode filter_off] in printer.cfg that
# turns the Nevermore off - but nothing anywhere ever triggers it.
# Right now it's dead code. This macro actually uses it: keeps the
# Nevermore running after a print finishes (to clear VOCs/particulates
# from ABS/ASA prints) and auto-shuts it off after MINUTES.
# Call from PRINT_END if you want it to run automatically every print,
# or just fire it manually after a print.
#####################################################################
[gcode_macro FILTER_AFTER_PRINT]
description: Run the Nevermore for MINUTES after a print, then auto-shutoff. Default 10 min.
gcode:
  {% set minutes = params.MINUTES|default(10)|float %}
  SET_FAN_SPEED FAN=Nevermore SPEED=1
  UPDATE_DELAYED_GCODE ID=filter_off DURATION={minutes * 60}
  RESPOND MSG="Nevermore running for {minutes} more minutes"


#####################################################################
# CALIBRATE_MPC_HOTEND
#
# Shortcut for Kalico's real MPC_CALIBRATE command (docs.kalico.gg/MPC.html).
# Your [extruder] already runs control: mpc (confirmed via your SAVE_CONFIG
# block), so this just saves typing the full command. TARGET defaults to
# 200C per Kalico's own recommendation - MPC calibration is temperature-
# independent, so a higher target doesn't give a better model.
# Remember to run SAVE_CONFIG after - MPC_CALIBRATE doesn't save automatically.
#####################################################################
[gcode_macro CALIBRATE_MPC_HOTEND]
description: Run Kalico MPC_CALIBRATE on the extruder. Usage: CALIBRATE_MPC_HOTEND [TARGET=200] [FAN_BREAKPOINTS=3]
gcode:
  {% set target = params.TARGET|default(200)|float %}
  {% set breakpoints = params.FAN_BREAKPOINTS|default(3)|int %}
  RESPOND MSG="Starting MPC calibration at {target}C - this takes a few minutes"
  MPC_CALIBRATE HEATER=extruder TARGET={target} FAN_BREAKPOINTS={breakpoints}
  RESPOND MSG="MPC calibration done - run SAVE_CONFIG to keep it"


#####################################################################
# TUNE_BED_PID
#
# Your heater_bed already runs real PID (control = pid via SAVE_CONFIG,
# not MPC), so unlike the extruder it actually benefits from a normal
# PID_CALIBRATE. Shortcut with a sensible default target.
#####################################################################
[gcode_macro TUNE_BED_PID]
description: Run PID_CALIBRATE on heater_bed. Usage: TUNE_BED_PID [TARGET=90]
gcode:
  {% set target = params.TARGET|default(90)|float %}
  RESPOND MSG="Starting bed PID tune at {target}C"
  PID_CALIBRATE HEATER=heater_bed TARGET={target}
  RESPOND MSG="Bed PID tune done - run SAVE_CONFIG to keep it"


#####################################################################
# DUMP_TMC_ALL
#
# Runs DUMP_TMC on every TMC2209 driver in one shot instead of typing
# seven separate commands when troubleshooting skipped steps or stalls.
# Output goes to the console/klippy.log.
#####################################################################
[gcode_macro DUMP_TMC_ALL]
description: Dump TMC driver status for every stepper at once
gcode:
  DUMP_TMC STEPPER=extruder
  DUMP_TMC STEPPER=stepper_x
  DUMP_TMC STEPPER=stepper_y
  DUMP_TMC STEPPER=stepper_z
  DUMP_TMC STEPPER=stepper_z1
  DUMP_TMC STEPPER=stepper_z2
  DUMP_TMC STEPPER=stepper_z3


#####################################################################
# PARK_TOOLHEAD
#
# Quick manual park (center X, front Y, safe Z) for when you want the
# toolhead out of the way without going through PAUSE (which also
# disables the filament sensor, saves gcode state, drops the hotend
# to 0, etc). Useful mid-tinkering at the console.
#####################################################################
[gcode_macro PARK_TOOLHEAD]
description: Move to a safe park position without pausing
gcode:
  {% set z_min = 10 %}
  SAVE_GCODE_STATE NAME=PARK_TOOLHEAD
  G90
  {% if 'z' not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Can't park - not homed"
  {% else %}
    {% set safe_z = [printer.toolhead.position.z + 5, z_min]|max %}
    G1 Z{safe_z} F900
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000
  {% endif %}
  RESTORE_GCODE_STATE NAME=PARK_TOOLHEAD MOVE=0

#####################################################################
# LAYER-TRIGGERED SCHEDULING  (concept: jschuh/klipper-macros)
#
# Schedule a pause / print-speed change / fan-speed change to happen
# at a specific layer, from the console, WHILE a print is already
# running - not just baked into the file up front. Useful for e.g.
# embedding a magnet/insert at a known layer without marring the
# surface, or dropping fan speed partway through a tall ABS/ASA part.
#
# REQUIRES ONE-TIME SLICER SETUP: add this single line to Orca's
# Printer Settings -> Custom G-code -> "Layer change G-code" box:
#     _ON_LAYER_CHANGE LAYER={layer_num}
# Without that line, these macros have nothing to trigger them.
#####################################################################
[gcode_macro _LAYER_TRIGGER_VARS]
description: Storage for layer-triggered scheduling. Do not call directly.
variable_pause_at_layer: -1
variable_speed_at_layer: -1
variable_speed_value: 100
variable_fan_at_layer: -1
variable_fan_value: 255
gcode:
  ; storage only

[gcode_macro PAUSE_AT_LAYER]
description: Pause at the next layer >= LAYER. Usage: PAUSE_AT_LAYER LAYER=10
gcode:
  {% set layer = params.LAYER|int %}
  SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=pause_at_layer VALUE={layer}
  RESPOND MSG="Will pause at layer {layer}"

[gcode_macro SPEED_AT_LAYER]
description: Set print speed factor at the next layer >= LAYER. Usage: SPEED_AT_LAYER LAYER=10 SPEED=50
gcode:
  {% set layer = params.LAYER|int %}
  {% set speed = params.SPEED|default(100)|int %}
  SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=speed_at_layer VALUE={layer}
  SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=speed_value VALUE={speed}
  RESPOND MSG="Will set speed to {speed}% at layer {layer}"

[gcode_macro FAN_AT_LAYER]
description: Set part-cooling fan (0-255) at the next layer >= LAYER. Usage: FAN_AT_LAYER LAYER=20 SPEED=128
gcode:
  {% set layer = params.LAYER|int %}
  {% set speed = params.SPEED|default(255)|int %}
  SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=fan_at_layer VALUE={layer}
  SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=fan_value VALUE={speed}
  RESPOND MSG="Will set fan to {speed}/255 at layer {layer}"

[gcode_macro _ON_LAYER_CHANGE]
description: Called automatically by the slicer's layer-change gcode. Do not call directly.
gcode:
  {% set layer = params.LAYER|default(0)|int %}
  {% set v = printer["gcode_macro _LAYER_TRIGGER_VARS"] %}
  {% if v.pause_at_layer >= 0 and layer >= v.pause_at_layer %}
    SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=pause_at_layer VALUE=-1
    PAUSE
  {% endif %}
  {% if v.speed_at_layer >= 0 and layer >= v.speed_at_layer %}
    SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=speed_at_layer VALUE=-1
    M220 S{v.speed_value}
  {% endif %}
  {% if v.fan_at_layer >= 0 and layer >= v.fan_at_layer %}
    SET_GCODE_VARIABLE MACRO=_LAYER_TRIGGER_VARS VARIABLE=fan_at_layer VALUE=-1
    M106 S{v.fan_value}
  {% endif %}


#####################################################################
# DUMP_VARIABLES / GET_VARIABLE   (concept: ellis3dp Print Tuning Guide)
#
# Debugging helpers. With as much custom macro state as this config
# now tracks (SET_MATERIAL, SET_RETRACT_DISTANCE, the heatsoak system,
# KNOMI status), these let you check current values from the console
# without digging through logs.
#####################################################################
[gcode_macro DUMP_VARIABLES]
description: Print all variables for a given macro. Usage: DUMP_VARIABLES MACRO=SET_MATERIAL [FILTER=<substring>]
gcode:
  {% set macro_name = params.MACRO|string %}
  {% set filter = params.FILTER|default('')|string|lower %}
  {% set svv = printer["gcode_macro " ~ macro_name] %}
  {% if not svv %}
    RESPOND TYPE=error MSG="No macro named '{macro_name}' found (or it has no variables)"
  {% else %}
    RESPOND MSG="--- {macro_name} variables ---"
    {% for key in svv %}
      {% if filter == '' or filter in key|lower %}
        RESPOND MSG="{key} = {svv[key]}"
      {% endif %}
    {% endfor %}
  {% endif %}

[gcode_macro GET_VARIABLE]
description: Print one variable from a macro. Usage: GET_VARIABLE MACRO=SET_MATERIAL VARIABLE=adaptive_mesh
gcode:
  {% set macro_name = params.MACRO|string %}
  {% set var_name = params.VARIABLE|string %}
  {% set svv = printer["gcode_macro " ~ macro_name] %}
  {% if not svv or var_name not in svv %}
    RESPOND TYPE=error MSG="No variable '{var_name}' on macro '{macro_name}'"
  {% else %}
    RESPOND MSG="{macro_name}.{var_name} = {svv[var_name]}"
  {% endif %}
