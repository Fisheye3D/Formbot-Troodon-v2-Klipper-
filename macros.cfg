  G1 X270 Y353 F500
  G1 X315 Y353 F500
  G1 X270 Y353 F500
  G1 X315 Y353 F500
  G1 X275 Y353 F500

  # Turn heater off
  M104 S0

  # Wait until nozzle cools to 120°C
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=120

  # Lift off brush
  G1 Z10 F2000



